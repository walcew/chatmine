[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatmine"
dynamic = ["version"]
description = "CLI que extrai histórico de chats de apps desktop reaproveitando a sessão local autenticada, num schema canônico consumível por IA."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyjwt>=2.8",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
chatmine = "chatmine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "chatmine.__version__"}

[tool.setuptools.package-data]
chatmine = ["SKILL.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
